# Pricing discount used when PromotionalPricingService is selected (@Primary).
store.discount-amount=20
# Value Added Tax applied at checkout (14%).
store.vat-rate=0.14
# Orders at or above this subtotal qualify for free shipping (eligible zones only).
store.free-shipping-threshold=5000.00
# Maximum quantity of a single SKU allowed on one cart line.
store.max-quantity-per-product=10
