<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New category - NileMart</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f5f5f5; }
        h1 { color: #333; }
        form { max-width: 480px; padding: 24px; background: white; }
        .field { margin-bottom: 16px; }
        .field > label { display: block; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select { box-sizing: border-box; width: 100%; padding: 8px; }
        .error { display: block; margin-top: 6px; color: #b00020; }
    </style>
</head>
<body>

<nav aria-label="Main navigation">
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>New category</h1>

<form th:action="@{/categories}" th:object="${category}" method="post">
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" minlength="2" maxlength="50" required>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>
    <div class="field">
        <label for="slug">Slug</label>
        <input type="text" id="slug" th:field="*{slug}" pattern="[a-z0-9-]+" required>
        <small>Use lower-case letters, digits and hyphens.</small>
        <span class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
    </div>
    <div class="field">
        <label for="parentSlug">Parent</label>
        <select id="parentSlug" th:field="*{parentSlug}">
            <option value="">None (top level)</option>
            <option th:each="parent : ${parentCategories}"
                    th:value="${parent.slug}" th:text="${parent.name}"></option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('parentSlug')}" th:errors="*{parentSlug}"></span>
    </div>
    <div class="field">
        <label for="displayOrder">Display order</label>
        <input type="number" id="displayOrder" th:field="*{displayOrder}" min="0" step="1" required>
        <span class="error" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></span>
    </div>
    <div class="field">
        <label for="active"><input type="checkbox" id="active" th:field="*{active}"> Active</label>
        <span class="error" th:if="${#fields.hasErrors('active')}" th:errors="*{active}"></span>
    </div>
    <button type="submit">Save category</button>
</form>

<p><a th:href="@{/categories}">Back to categories</a></p>

</body>
</html>
