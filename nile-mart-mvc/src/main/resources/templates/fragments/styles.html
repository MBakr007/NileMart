<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shared styles</title>
</head>
<body>
<style th:fragment="styles">
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f5f5f5;
    }

    h1 {
        color: #333;
    }

    .menu {
        margin-bottom: 24px;
    }

    .menu a {
        margin-right: 12px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 12px;
        border: 1px solid #ddd;
        text-align: left;
    }

    th {
        background-color: #333;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    form {
        max-width: 520px;
        padding: 20px;
        background: white;
    }

    label {
        display: block;
        margin: 10px 0;
    }

    .field-error {
        color: #b00020;
        font-size: 0.9em;
    }
</style>
</body>
</html>
