<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New brand - NileMart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        form {
            max-width: 480px;
            padding: 24px;
            background: white;
        }

        .field {
            margin-bottom: 16px;
        }

        .field > label {
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"] {
            box-sizing: border-box;
            width: 100%;
            padding: 8px;
        }

        .error {
            display: block;
            margin-top: 6px;
            color: #b00020;
        }
    </style>
</head>
<body>

<nav aria-label="Main navigation">
    <a th:href="@{/products}">Products</a> |
    <a th:href="@{/categories}">Categories</a> |
    <a th:href="@{/brands}">Brands</a>
</nav>

<h1>New brand</h1>

<form th:action="@{/brands}" th:object="${brand}" method="post">
    <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" minlength="2" maxlength="50" required>
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
    </div>

    <div class="field">
        <label for="slug">Slug</label>
        <input type="text" id="slug" th:field="*{slug}" pattern="[a-z0-9-]+" required>
        <small>Use lower-case letters, digits and hyphens, for example nile-cotton.</small>
        <span class="error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
    </div>

    <div class="field">
        <label for="active">
            <input type="checkbox" id="active" th:field="*{active}"> Active
        </label>
        <span class="error" th:if="${#fields.hasErrors('active')}" th:errors="*{active}"></span>
    </div>

    <button type="submit">Save brand</button>
</form>

<p><a th:href="@{/brands}">Back to brands</a></p>

</body>
</html>
